<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Digital Librarian{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">

  <nav class="bg-gray-900 border-b border-gray-800 px-6 py-3 flex items-center gap-6">
    <a href="/" class="text-lg font-semibold text-white tracking-tight">📚 Digital Librarian</a>
    <a href="/" class="text-sm text-gray-400 hover:text-white transition-colors">Dashboard</a>
    <a href="/files" class="text-sm text-gray-400 hover:text-white transition-colors">Files</a>
    <a href="/folders" class="text-sm text-gray-400 hover:text-white transition-colors">Folders</a>
    <a href="/people" class="text-sm text-gray-400 hover:text-white transition-colors">Faces</a>
    <a href="/duplicates" class="text-sm text-gray-400 hover:text-white transition-colors">Duplicates</a>
    <a href="/queue" class="text-sm text-gray-400 hover:text-white transition-colors">Action Queue</a>
  </nav>

  <main class="{% block main_class %}px-6 py-8 max-w-7xl mx-auto{% endblock %}">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
