[project]
name = "magpie"
version = "0.1.0"
description = "Magpie — local-first file indexing and pruning tool"
requires-python = ">=3.12"
dependencies = [
    "blake3>=1.0.0",
    "typer>=0.12",
    "rich>=13.0",
    "python-magic>=0.4.27",
    "exifread>=3.0",
    "Pillow>=10.0",
    "imagehash>=4.3",
    "fastapi>=0.135.3",
    "uvicorn[standard]>=0.44.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.26",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17",
    "rawpy>=0.19",
    "pillow-heif>=0.18",
    "ollama>=0.6.1",
    "sumy>=0.12.0",
    "insightface>=0.7.3",
    "onnxruntime>=1.18",
    "mutagen>=1.47",
    "google-api-python-client>=2.0",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.0",
    "dropbox>=12.0",
    "boto3>=1.28",
    "requests>=2.31",
    "ngrok>=1.7.0",
]

[project.scripts]
magpie = "magpie.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
